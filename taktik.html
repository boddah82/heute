<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taktik-Editor</title>
<style>
:root{
  --own:#2563eb; --own-dark:#1d4ed8;
  --opp:#dc2626; --opp-dark:#b91c1c;
  --ball:#f59e0b;
  --hl:#facc15;
  --bg:#0f172a; --panel:#1e293b; --panel2:#243247; --border:#334155;
  --text:#e2e8f0; --text-dim:#94a3b8;
  --accent:#38bdf8; --danger:#f87171; --ok:#4ade80;
  --pitch:#2e7d4f; --pitch-line:rgba(255,255,255,.75);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:13px;overflow:hidden;}
button{font-family:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:6px;padding:6px 10px;}
button:hover{background:#2d3d54;}
button:disabled{opacity:.4;cursor:default;}
button.primary{background:var(--accent);border-color:var(--accent);color:#03202e;font-weight:600;}
button.primary:hover{background:#5cc9fb;}
button.danger{border-color:var(--danger);color:var(--danger);}
button.ghost{background:transparent;}
button.small{padding:3px 7px;font-size:11.5px;}
input[type=text],input[type=number],select,textarea{
  background:#0b1424;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 7px;font-family:inherit;font-size:12.5px;
}
input:focus,select:focus,textarea:focus{outline:1.5px solid var(--accent);}
label{font-size:11px;color:var(--text-dim);}
h1,h2,h3{margin:0;}
#app{height:100vh;display:flex;flex-direction:column;}

/* Header */
#app-header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0;}
#app-header .brand{font-weight:700;font-size:14px;color:var(--accent);white-space:nowrap;}
.hgroup{display:flex;align-items:center;gap:6px;padding:0 8px;border-left:1px solid var(--border);flex-wrap:wrap;}
.hgroup:first-of-type{border-left:none;}
#situation-select{min-width:160px;}
.mode-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.mode-toggle button{border:none;border-radius:0;background:var(--panel2);}
.mode-toggle button.active{background:var(--accent);color:#03202e;font-weight:700;}
#save-status{font-size:11.5px;padding:4px 9px;border-radius:12px;background:#0b1424;border:1px solid var(--border);white-space:nowrap;}
#save-status.dirty{background:#3a2410;border-color:#a35b12;color:#fbbf24;}
#save-status.clean{background:#0f2b1a;border-color:#1f6b3a;color:var(--ok);}
.spacer{flex:1;}

/* Body layout */
#app-body{flex:1;display:flex;min-height:0;}
aside{background:var(--panel);border-color:var(--border);flex-shrink:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:12px;}
#sidebar-left{width:270px;border-right:1px solid var(--border);}
#sidebar-right{width:290px;border-left:1px solid var(--border);}
.panel-box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.panel-box h3{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:flex-start;align-items:center;gap:6px;}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.row.between{justify-content:space-between;}
.grow{flex:1;min-width:0;}

/* object rows */
.obj-row{display:flex;align-items:center;gap:4px;padding:4px 4px;border-radius:5px;background:#0b1424;border:1px solid transparent;}
.obj-row.selected{border-color:var(--accent);}
.obj-row.ghosted{opacity:.5;}
.obj-row input[type=text]{width:100%;}
.obj-row .num{width:34px;text-align:center;flex-shrink:0;}
.obj-row .nm{width:64px;flex-shrink:0;}
.obj-row .rl{width:48px;flex-shrink:0;}
.obj-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
.swatch{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.swatch.own{background:var(--own);} .swatch.opp{background:var(--opp);}

/* Field */
#field-main{flex:1;display:flex;flex-direction:column;min-width:0;padding:10px;gap:8px;}
#field-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
#field{position:relative;width:100%;max-width:100%;max-height:100%;background:
  radial-gradient(ellipse at 50% 15%, rgba(255,255,255,.06), rgba(255,255,255,0) 55%),
  repeating-linear-gradient(90deg,#2c7a49 0,#2c7a49 40px,#33864f 40px,#33864f 80px);
  border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 0 0 1px var(--border),0 16px 40px rgba(0,0,0,.5);overflow:hidden;}
#field-svg{position:absolute;inset:0;width:100%;height:100%;}
#field-svg .line{stroke:var(--pitch-line);stroke-width:.45;fill:none;}
#field-svg .spot{fill:var(--pitch-line);}
#markers-layer{position:absolute;inset:0;}
.marker{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;touch-action:none;transition:opacity .15s;}
.marker .dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;letter-spacing:-.02em;color:#fff;border:2px solid rgba(255,255,255,.92);box-shadow:0 1px 2px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.45);}
.marker.player .dot{background:radial-gradient(circle at 32% 28%, var(--own-dark) 0%, var(--own) 55%, var(--own-dark) 100%);}
.marker.opponent .dot{background:radial-gradient(circle at 32% 28%, var(--opp-dark) 0%, var(--opp) 55%, var(--opp-dark) 100%);}
.marker.ball .dot{width:16px;height:16px;background:radial-gradient(circle at 32% 28%, #ffd47a 0%, var(--ball) 60%, #92600a 100%);border-color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4),0 3px 7px rgba(0,0,0,.5);}
.marker .tag{margin-top:2px;font-size:9.5px;background:rgba(2,10,20,.72);padding:1px 4px;border-radius:4px;white-space:nowrap;color:#fff;}
.marker.ghost .dot{opacity:.35;border-style:dashed;}
.marker.highlighted .dot{box-shadow:0 0 0 3px var(--hl),0 2px 6px rgba(0,0,0,.5);}
.marker.dimmed{opacity:.28;}
.marker.focused .dot{width:32px;height:32px;box-shadow:0 0 0 4px var(--hl),0 0 14px 2px rgba(250,204,21,.7);}
.marker.dragging{cursor:grabbing;z-index:50;}
.marker.selected .dot{box-shadow:0 0 0 3px #fff;}
#field.presentation .marker{cursor:default;}
.marker .facing{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%) rotate(calc(var(--facing-deg,0deg) + 90deg)) translateY(-16px);pointer-events:none;}
.marker .facing::after{content:"";position:absolute;left:-4px;top:-6px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid rgba(255,255,255,.85);}
.sugg-ghost{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:2px dashed var(--hl);pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--hl);background:rgba(250,204,21,.1);}
#paths-layer .path-suggest{stroke:var(--hl);stroke-width:.5;stroke-dasharray:1.2 1;}
#paths-layer .path-press{stroke:var(--danger);stroke-width:.35;stroke-dasharray:.5 .9;opacity:.65;}
.compass{display:grid;grid-template-columns:repeat(3,26px);grid-template-rows:repeat(3,26px);gap:3px;}
.compass button{padding:0;font-size:13px;line-height:1;}
.compass button.active{background:var(--accent);border-color:var(--accent);color:#03202e;}
.sugg-result{font-size:11.5px;color:var(--text-dim);display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.sugg-item{background:#0b1424;border:1px solid var(--border);border-radius:6px;padding:5px 7px;}
.sugg-item b{color:var(--text);}
#paths-layer path{fill:none;}
#paths-layer .path-own{stroke:var(--own);stroke-width:.8;stroke-linecap:round;}
#paths-layer .path-opp{stroke:var(--opp);stroke-width:.8;stroke-linecap:round;}
#paths-layer .path-ball{stroke:var(--ball);stroke-width:.65;stroke-linecap:round;stroke-dasharray:1.6 1.3;}

/* timeline */
#timeline-list{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto;}
.step-item{display:flex;align-items:center;gap:4px;background:#0b1424;border:1px solid var(--border);border-radius:6px;padding:5px 6px;cursor:pointer;}
.step-item.active{border-color:var(--accent);background:#0e2436;}
.step-item .idx{width:18px;height:18px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:10.5px;flex-shrink:0;}
.step-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;}
.step-item .btns{display:flex;gap:2px;}

/* presentation bar */
#presentation-bar{display:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;flex-wrap:wrap;gap:10px;align-items:center;}
#presentation-bar.show{display:flex;}
.persp-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.persp-toggle button{border:none;border-radius:0;}
.persp-toggle button.active{background:var(--accent);color:#03202e;font-weight:700;}
#playpause{width:38px;}

/* context panel */
#context-panel textarea{width:100%;min-height:50px;resize:vertical;}
.hint{color:var(--text-dim);font-size:11.5px;}

/* modal & toast */
#modal-root{position:fixed;inset:0;pointer-events:none;z-index:200;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;pointer-events:all;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.modal-box h3{margin-bottom:8px;font-size:14px;}
.modal-box p{font-size:12.5px;color:var(--text-dim);margin-bottom:14px;line-height:1.4;}
.modal-box .btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.modal-box.template-gallery{max-width:900px;max-height:85vh;overflow-y:auto;}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:14px;}
.template-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:5px;}
.template-cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);}
.template-name{font-weight:700;font-size:13px;}
.template-desc{font-size:11.5px;color:var(--text-dim);flex:1;line-height:1.35;}
.panel-box h3{cursor:default;}
.collapse-toggle{margin-left:auto;flex-shrink:0;}
.panel-box.collapsed > *:not(h3){display:none;}
#toast-wrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{background:#0b1424;border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toastin .2s ease;}
.toast.err{border-color:var(--danger);color:#fecaca;}
.toast.ok{border-color:var(--ok);color:#bbf7d0;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.hidden{display:none !important;}
#file-input{display:none;}
.chk-row{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#334155;border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <header id="app-header">
    <div class="brand">⚽ Taktik-Editor</div>
    <div class="hgroup">
      <select id="situation-select"></select>
      <button id="btn-sit-new" class="small">+ Neu</button>
      <button id="btn-sit-rename" class="small">Umbenennen</button>
      <button id="btn-sit-delete" class="small danger">Löschen</button>
    </div>
    <div class="hgroup">
      <div class="mode-toggle">
        <button id="btn-mode-editor" data-mode="editor">Editor</button>
        <button id="btn-mode-presentation" data-mode="presentation">Präsentation</button>
      </div>
    </div>
    <div class="hgroup" id="editor-save-group">
      <span id="save-status" class="clean">Gespeichert</span>
      <button id="btn-update-step" class="small primary">💾 Aktualisieren</button>
      <button id="btn-add-step" class="small">➕ Neuer Schritt</button>
      <button id="btn-reset-field" class="small ghost">↺ Zurücksetzen</button>
    </div>
    <div class="spacer"></div>
    <div class="hgroup">
      <button id="btn-templates" class="small primary">📚 Vorlagen</button>
      <button id="btn-export" class="small">Export</button>
      <button id="btn-import" class="small">Import</button>
      <input type="file" id="file-input" accept="application/json">
    </div>
  </header>

  <div id="app-body">
    <aside id="sidebar-left">
      <div class="panel-box" id="situation-meta-box">
        <h3>Situation</h3>
        <div class="row"><label class="grow">Kategorie</label></div>
        <select id="sit-category"></select>
        <div class="row"><label class="grow">Spielfeldausschnitt</label></div>
        <select id="sit-fieldview"></select>
      </div>
      <div class="panel-box">
        <h3>Eigene Spieler <button id="btn-add-player" class="small">+ Spieler</button></h3>
        <div class="row">
          <select id="own-formation-select" class="grow"></select>
          <button id="btn-apply-own-formation" class="small">Formation anwenden</button>
        </div>
        <div class="obj-list" id="own-list"></div>
      </div>
      <div class="panel-box collapsed" id="suggestion-panel">
        <h3>🧭 Anspiel-Vorschlag</h3>
        <p class="hint">Grobe Heuristik (Distanz, Deckungsschatten, offene Passwinkel) für den aktuellen Ballführer — kein perfektes Taktik-Orakel, nur ein Vorschlag zum Anpassen.</p>
        <button id="btn-suggest" class="small primary">Vorschlag berechnen</button>
        <div id="suggestion-result"></div>
      </div>
      <div class="panel-box">
        <h3>Gegner <button id="btn-add-opponent" class="small">+ Gegner</button></h3>
        <div class="row">
          <select id="opp-formation-select" class="grow"></select>
          <button id="btn-apply-opp-formation" class="small">Formation anwenden</button>
        </div>
        <div class="obj-list" id="opp-list"></div>
      </div>
      <div class="panel-box collapsed">
        <h3>Ball</h3>
        <div class="row between">
          <label class="chk-row"><input type="checkbox" id="ball-visible"> sichtbar</label>
        </div>
        <div class="row"><label class="grow">Ballbesitz</label></div>
        <select id="ball-owner"></select>
      </div>
      <div class="panel-box collapsed">
        <h3>Darstellung</h3>
        <label class="chk-row"><input type="checkbox" id="chk-show-labels" checked> Name/Rolle anzeigen</label>
        <label class="chk-row"><input type="checkbox" id="chk-show-paths" checked> Laufwege anzeigen</label>
      </div>
    </aside>

    <main id="field-main">
      <div id="field-wrap">
        <div id="field">
          <svg id="field-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <g id="markings"></g>
            <g id="paths-layer"></g>
          </svg>
          <div id="markers-layer"></div>
        </div>
      </div>
      <div id="presentation-bar">
        <div class="row">
          <button id="btn-prev" title="Zurück">⏮</button>
          <button id="playpause" title="Play/Pause">▶</button>
          <button id="btn-next" title="Weiter">⏭</button>
          <button id="btn-p-reset" title="Reset">↺</button>
        </div>
        <div class="row">
          <label>Tempo</label>
          <select id="speed-select">
            <option value="slow">Langsam</option>
            <option value="normal" selected>Normal</option>
            <option value="fast">Schnell</option>
          </select>
        </div>
        <div class="row">
          <div class="persp-toggle">
            <button data-persp="overview" class="active">Gesamtbild</button>
            <button data-persp="sequence">Bewegungsablauf</button>
            <button data-persp="myplayer">Mein Spieler</button>
          </div>
        </div>
        <div class="row" id="focus-player-row">
          <label>Spieler</label>
          <select id="focus-player-select"></select>
        </div>
      </div>
    </main>

    <aside id="sidebar-right">
      <div class="panel-box">
        <h3>Schritte</h3>
        <div id="timeline-list"></div>
      </div>
      <div class="panel-box" id="context-panel">
        <h3>Kontext</h3>
        <div id="step-meta-editor">
          <label>Schrittname</label>
          <input type="text" id="step-name-input" class="grow">
          <label>Taktischer Hinweis</label>
          <textarea id="step-note-input"></textarea>
        </div>
        <div id="focus-info" class="hint"></div>
        <div id="selected-object-editor"></div>
      </div>
    </aside>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-wrap"></div>

<script>
(function(){
"use strict";

/* =========================================================
   1. KONSTANTEN & DATENMODELL
   ========================================================= */
var SCHEMA_VERSION = 1;
var STORAGE_KEY = "taktik-editor-state-v1";
var PITCH_LENGTH = 105, PITCH_WIDTH = 68;

var CATEGORIES = {
  "corner-off":"Standard – Offensive Ecke", "corner-def":"Standard – Defensive Ecke",
  "freekick-off":"Standard – Offensiver Freistoß", "freekick-def":"Standard – Defensiver Freistoß",
  "buildup":"Spiel mit Ball – Aufbau", "attack":"Spiel mit Ball – Angriff",
  "organization":"Spiel ohne Ball – Organisation", "pressing":"Spiel ohne Ball – Pressing",
  "transition-off":"Umschalten – Offensiv", "transition-def":"Umschalten – Defensiv",
  "formation":"Grundordnung / Formation", "custom":"Sonstige Taktik"
};
/* Formationsvorlagen nach Vierer-/Dreierkette-Systematik (Trainer-Referenzmaterial),
   x=0 eigenes Tor -> x=100 gegnerisches Tor, y=0..100 Spielfeldbreite */
var FORMATIONS = {
  "4-4-2": [["TW",5,50],["IV",20,38],["IV",20,62],["AV",22,15],["AV",22,85],
    ["LM",50,15],["ZM",48,40],["ZM",48,60],["RM",50,85],["ST",75,38],["ST",75,62]],
  "4-3-3": [["TW",5,50],["IV",20,38],["IV",20,62],["AV",22,15],["AV",22,85],
    ["ZDM",40,50],["ZM",52,32],["ZM",52,68],["LA",75,15],["ST",80,50],["RA",75,85]],
  "4-2-3-1": [["TW",5,50],["IV",20,38],["IV",20,62],["AV",22,15],["AV",22,85],
    ["ZDM",38,40],["ZDM",38,60],["ZOM",60,50],["LA",65,18],["RA",65,82],["ST",85,50]],
  "3-5-2": [["TW",5,50],["IV",18,30],["IV",15,50],["IV",18,70],
    ["FS",45,12],["FS",45,88],["ZM",42,38],["ZM",42,62],["ZOM",58,50],["ST",78,40],["ST",78,60]],
  "5-3-2": [["TW",5,50],["IV",18,30],["IV",15,50],["IV",18,70],["AV",22,12],["AV",22,88],
    ["ZM",45,35],["ZM",42,50],["ZM",45,65],["ST",78,40],["ST",78,60]]
};
var FIELD_VIEWS = {
  full:{label:"Komplettes Feld", vx:0, vy:0, vw:100, vh:100},
  half:{label:"Halbes Feld", vx:50, vy:0, vw:50, vh:100},
  penalty:{label:"Strafraum/Standard", vx:74, vy:0, vw:26, vh:100}
};
var SPEEDS = {slow:1700, normal:950, fast:480};
var HOLD_MS = {slow:750, normal:450, fast:250};

function uid(prefix){
  return prefix + "-" + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2,7);
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function makeObj(id, number, name, role, x, y){
  return {id:id, number:number, name:name||"", role:role||"", x:x, y:y, orientation:0, visible:true, highlighted:false, task:""};
}
function makeBall(x,y){ return {x:x, y:y, ownerId:null, visible:true}; }
function makeStep(name){
  return {id:uid("step"), name:name||"Schritt", note:"", players:[], opponents:[], ball:makeBall(50,50), paths:[]};
}
function makeSituation(name, category, fieldView){
  return {id:uid("sit"), name:name||"Neue Situation", category:category||"custom", fieldView:fieldView||"full", activeStepId:null, steps:[]};
}
function emptyRootState(){
  return {
    schemaVersion: SCHEMA_VERSION,
    situations: [],
    activeSituationId: null,
    ui: {mode:"editor", perspective:"overview", focusPlayerId:null, showPaths:true, showLabels:true, speed:"normal"}
  };
}

/* =========================================================
   2. LAUFZEIT-ZUSTAND (nicht persistiert)
   ========================================================= */
var state = null; // persistiertes Datenmodell
var runtime = {
  workingField: {players:[], opponents:[], ball: makeBall(50,50)},
  dirty: false,
  selectedObjectId: null,
  drag: null,
  currentViewBox: FIELD_VIEWS.full,
  presentation: {playing:false, raf:null, playTimeout:null, stopRequested:false},
  suggestion: null
};

/* =========================================================
   3. PERSISTENZ
   ========================================================= */
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ showToast("Speichern in localStorage fehlgeschlagen: "+e.message, "err"); }
}

function validateStateShape(raw){
  if (!raw || typeof raw !== "object") throw new Error("Kein gültiges Objekt.");
  if (typeof raw.schemaVersion !== "number") throw new Error("schemaVersion fehlt.");
  if (raw.schemaVersion > SCHEMA_VERSION) throw new Error("Datei stammt aus einer neueren, nicht unterstützten Version ("+raw.schemaVersion+").");
  if (!Array.isArray(raw.situations)) throw new Error("Feld 'situations' fehlt oder ist kein Array.");
  raw.situations.forEach(function(sit, si){
    if (!sit || typeof sit.id !== "string") throw new Error("Situation #"+si+" hat keine gültige id.");
    if (!Array.isArray(sit.steps)) throw new Error("Situation '"+(sit.name||sit.id)+"' hat kein 'steps'-Array.");
    sit.steps.forEach(function(st, sti){
      if (!st || typeof st.id !== "string") throw new Error("Schritt #"+sti+" in Situation '"+sit.name+"' hat keine gültige id.");
      ["players","opponents"].forEach(function(k){
        if (!Array.isArray(st[k])) throw new Error("Schritt '"+st.name+"': Feld '"+k+"' fehlt.");
        st[k].forEach(function(o){
          if (typeof o.id !== "string" || typeof o.x !== "number" || typeof o.y !== "number"){
            throw new Error("Schritt '"+st.name+"': ungültiges Objekt in '"+k+"'.");
          }
        });
      });
      if (!st.ball || typeof st.ball.x !== "number" || typeof st.ball.y !== "number"){
        throw new Error("Schritt '"+st.name+"': Ballobjekt fehlt oder ungültig.");
      }
    });
  });
  return true;
}

function migrateState(raw){
  // Platz für künftige Migrationen: if (raw.schemaVersion < 2) { ... raw.schemaVersion = 2; }
  validateStateShape(raw);
  return raw;
}

function loadPersisted(){
  var raw = null;
  try{
    var txt = localStorage.getItem(STORAGE_KEY);
    if (txt) raw = JSON.parse(txt);
  }catch(e){ raw = null; }
  if (raw){
    try{
      state = migrateState(raw);
      return;
    }catch(e){
      console.warn("Gespeicherter Zustand ungültig, starte mit Demo-Daten:", e.message);
    }
  }
  state = emptyRootState();
  var demo = buildDemoSituation();
  state.situations.push(demo);
  state.activeSituationId = demo.id;
  persist();
}

/* Formationsbasierte Vorlagen (Aufbau/Pressing/Umschalten/Organisation) */
function formRows(key, mirror){
  return FORMATIONS[key].map(function(row,i){
    var x = mirror ? (100 - row[1]) : row[1];
    return [i+1, row[0], x, row[2]];
  });
}
function tweakRows(rows, overrides){
  var copy = rows.map(function(r){ return r.slice(); });
  Object.keys(overrides).forEach(function(k){
    var i = +k; copy[i][2] = overrides[k][0]; copy[i][3] = overrides[k][1];
  });
  return copy;
}
function rowsToObjs(rows, ids){
  return rows.map(function(row,i){
    return makeObj(ids[i], row[0], "", row[1], row[2], row[3]);
  });
}
function buildFullPitchTemplate(name, category, stepsDef){
  var sit = makeSituation(name, category, "full");
  var ownIds = stepsDef[0].own.map(function(){ return uid("p"); });
  var oppIds = stepsDef[0].opp.map(function(){ return uid("o"); });
  sit.steps = stepsDef.map(function(sd){
    var step = makeStep(sd.name);
    step.note = sd.note || "";
    step.players = rowsToObjs(sd.own, ownIds);
    step.opponents = rowsToObjs(sd.opp, oppIds);
    if (sd.taskOwn){
      Object.keys(sd.taskOwn).forEach(function(k){ step.players[+k].task = sd.taskOwn[k]; });
    }
    if (sd.ball){
      var ownerId = null;
      if (sd.ball[2]==="own") ownerId = ownIds[sd.ball[3]];
      else if (sd.ball[2]==="opp") ownerId = oppIds[sd.ball[3]];
      step.ball = {x:sd.ball[0], y:sd.ball[1], ownerId:ownerId, visible:true};
    } else {
      step.ball = makeBall(50,50); step.ball.visible = false;
    }
    return step;
  });
  sit.activeStepId = sit.steps[0].id;
  return sit;
}

/* =========================================================
   5. STATE-ZUGRIFF & MUTATIONEN
   ========================================================= */
function getActiveSituation(){
  if (!state.activeSituationId) return null;
  return state.situations.find(function(s){ return s.id===state.activeSituationId; }) || null;
}
function getStepById(sit, id){
  if (!sit) return null;
  return sit.steps.find(function(s){ return s.id===id; }) || null;
}
function getActiveStep(){
  var sit = getActiveSituation();
  if (!sit) return null;
  return getStepById(sit, sit.activeStepId);
}
function getStepIndex(sit, id){
  if (!sit) return -1;
  return sit.steps.findIndex(function(s){ return s.id===id; });
}
function loadWorkingFieldFromStep(step){
  if (step){
    runtime.workingField = {players:deepClone(step.players), opponents:deepClone(step.opponents), ball:deepClone(step.ball)};
  } else {
    runtime.workingField = {players:[], opponents:[], ball: makeBall(50,50)};
  }
  runtime.dirty = false;
  runtime.selectedObjectId = null;
  runtime.suggestion = null;
}

function markDirty(){ runtime.dirty = true; runtime.suggestion = null; }

function snapshotFromWorking(){
  return {players:deepClone(runtime.workingField.players), opponents:deepClone(runtime.workingField.opponents), ball:deepClone(runtime.workingField.ball)};
}

function saveActiveStepField(){
  var step = getActiveStep();
  if (!step) return;
  var snap = snapshotFromWorking();
  step.players = snap.players; step.opponents = snap.opponents; step.ball = snap.ball;
  runtime.dirty = false;
  persist();
  render();
  showToast("Schritt aktualisiert.", "ok");
}

function addStepFromWorking(){
  var sit = getActiveSituation();
  if (!sit) return;
  var snap = snapshotFromWorking();
  var step = makeStep((sit.steps.length+1)+" – Neuer Schritt");
  step.players = snap.players; step.opponents = snap.opponents; step.ball = snap.ball;
  var insertAt = getStepIndex(sit, sit.activeStepId);
  if (insertAt<0) sit.steps.push(step); else sit.steps.splice(insertAt+1, 0, step);
  sit.activeStepId = step.id;
  runtime.dirty = false;
  persist();
  render();
  showToast("Neuer Schritt gespeichert.", "ok");
}

function duplicateStep(stepId){
  var sit = getActiveSituation(); if (!sit) return;
  var idx = getStepIndex(sit, stepId); if (idx<0) return;
  var orig = sit.steps[idx];
  var copy = deepClone(orig);
  copy.id = uid("step");
  copy.name = orig.name + " (Kopie)";
  sit.steps.splice(idx+1, 0, copy);
  doSwitchStep(copy.id);
  persist();
  render();
}

function deleteStep(stepId){
  var sit = getActiveSituation(); if (!sit) return;
  var idx = getStepIndex(sit, stepId); if (idx<0) return;
  showConfirm("Schritt löschen", "Diesen Schritt wirklich unwiderruflich löschen?", function(){
    sit.steps.splice(idx,1);
    if (sit.activeStepId === stepId){
      var newIdx = clamp(idx-1, 0, sit.steps.length-1);
      sit.activeStepId = sit.steps.length ? sit.steps[newIdx].id : null;
      loadWorkingFieldFromStep(getActiveStep());
    }
    persist();
    render();
  });
}

function renameStep(stepId, name){
  var sit = getActiveSituation(); if (!sit) return;
  var step = getStepById(sit, stepId); if (!step) return;
  step.name = name;
  persist();
  render();
}

function moveStep(stepId, dir){
  var sit = getActiveSituation(); if (!sit) return;
  var idx = getStepIndex(sit, stepId);
  var newIdx = idx+dir;
  if (idx<0 || newIdx<0 || newIdx>=sit.steps.length) return;
  var arr = sit.steps;
  var tmp = arr[idx]; arr[idx]=arr[newIdx]; arr[newIdx]=tmp;
  persist();
  render();
}

function resetActiveStepField(){
  loadWorkingFieldFromStep(getActiveStep());
  render();
  showToast("Feld auf letzten Speicherstand zurückgesetzt.", "ok");
}

/* --- Schrittwechsel mit Schutz vor Datenverlust --- */
function doSwitchStep(stepId){
  var sit = getActiveSituation(); if (!sit) return;
  sit.activeStepId = stepId;
  loadWorkingFieldFromStep(getStepById(sit, stepId));
  persist();
}
function requestSwitchStep(stepId){
  var sit = getActiveSituation(); if (!sit) return;
  if (sit.activeStepId === stepId){ return; }
  guardUnsavedThen(function(){ doSwitchStep(stepId); render(); });
}

function guardUnsavedThen(proceed){
  if (!runtime.dirty){ proceed(); return; }
  showModal({
    title: "Ungespeicherte Änderungen",
    message: "Der aktuelle Feldzustand wurde seit dem letzten Speichern verändert. Was möchtest du tun?",
    buttons: [
      {label:"Speichern & wechseln", cls:"primary", action:function(){ saveActiveStepField(); proceed(); }},
      {label:"Verwerfen & wechseln", cls:"danger", action:function(){ proceed(); }},
      {label:"Abbrechen", cls:"ghost", action:function(){}}
    ]
  });
}

function roundTo45(deg){
  deg = ((deg % 360) + 360) % 360;
  return Math.round(deg / 45) * 45 % 360;
}
function angleToward(from, to){
  var deg = Math.atan2(to.y - from.y, to.x - from.x) * 180 / Math.PI;
  return roundTo45(deg);
}
var COMPASS_DIRS = [
  {deg:225, icon:"↖", label:"NW"}, {deg:270, icon:"↑", label:"N"}, {deg:315, icon:"↗", label:"NE"},
  {deg:180, icon:"←", label:"W"},  {deg:null, icon:"•", label:""}, {deg:0,   icon:"→", label:"O"},

/* =========================================================
   5b. ANSPIEL-VORSCHLAG (grobe Heuristik)
   ========================================================= */
var PRESS_RADIUS = 16;
function ptDist(a, b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function angleDiffRad(a, b){
  var d = a - b;
  while (d > Math.PI) d -= 2*Math.PI;
  while (d < -Math.PI) d += 2*Math.PI;
  return d;
}
function scoreCandidate(cx, cy, carrier, opponents, teammate, chosen){
  var distCarrier = Math.hypot(cx-carrier.x, cy-carrier.y);
  var idealScore = 1 - Math.min(1, Math.abs(distCarrier-18)/18);
  var minOppDist = 40;
  opponents.forEach(function(o){ minOppDist = Math.min(minOppDist, Math.hypot(cx-o.x, cy-o.y)); });
  var openness = Math.min(1.4, minOppDist/18);
  var angC = Math.atan2(cy-carrier.y, cx-carrier.x);
  var shadowPenalty = 0;
  opponents.forEach(function(o){
    var toOpp = Math.hypot(o.x-carrier.x, o.y-carrier.y);
    if (distCarrier > toOpp*0.55){
      var angO = Math.atan2(o.y-carrier.y, o.x-carrier.x);
      if (Math.abs(angleDiffRad(angO, angC)) < 0.4) shadowPenalty += 1;
    }
  });
  var overlapPenalty = 0;
  chosen.forEach(function(s){
    var angS = Math.atan2(s.y-carrier.y, s.x-carrier.x);
    if (Math.abs(angleDiffRad(angS, angC)) < 0.45) overlapPenalty += 1;
  });
  var movePenalty = Math.hypot(cx-teammate.x, cy-teammate.y) / 45;
  return idealScore*2 + openness*1.4 - shadowPenalty*2.2 - overlapPenalty*1.6 - movePenalty;
}
function computeSupportSuggestion(){
  var wf = runtime.workingField;
  var carrierId = wf.ball.ownerId;
  var carrier = wf.players.find(function(p){ return p.id===carrierId && p.visible!==false; });
  if (!carrier){ return {error:"Kein eigener Ballführer erkannt. Bitte im Ball-Panel einen Ballbesitzer aus den eigenen Spielern wählen."}; }
  var opponents = wf.opponents.filter(function(o){ return o.visible!==false; });
  var pressers = opponents.filter(function(o){ return ptDist(o, carrier) <= PRESS_RADIUS; })
    .sort(function(a,b){ return ptDist(a,carrier)-ptDist(b,carrier); });
  var teammates = wf.players.filter(function(p){ return p.id!==carrier.id && p.visible!==false; })
    .sort(function(a,b){ return ptDist(a,carrier)-ptDist(b,carrier); })
    .slice(0, 4);
  if (!teammates.length){ return {error:"Keine weiteren eigenen Spieler auf dem Feld, für die ein Vorschlag berechnet werden könnte."}; }

  var chosen = [];
  var items = teammates.map(function(tm){
    var best = null;
    [14, 22].forEach(function(radius){
      for (var a=0; a<360; a+=45){
        var rad = a*Math.PI/180;
        var cx = clamp(carrier.x + Math.cos(rad)*radius, 2, 98);
        var cy = clamp(carrier.y + Math.sin(rad)*radius, 2, 98);
        var score = scoreCandidate(cx, cy, carrier, opponents, tm, chosen);
        if (!best || score > best.score) best = {x:cx, y:cy, score:score};
      }
    });
    chosen.push(best);
    return {
      playerId: tm.id, number: tm.number, name: tm.name,
      fromX: tm.x, fromY: tm.y, x: best.x, y: best.y,
      orientation: 0,
      moved: Math.hypot(best.x-tm.x, best.y-tm.y)
    };
  });
  items.forEach(function(it){ it.orientation = angleToward({x:it.x,y:it.y}, carrier); });

  var carrierOrientation = null;
  if (pressers.length){
    var avgX=0, avgY=0;
    pressers.forEach(function(p){ avgX+=p.x; avgY+=p.y; });
    avgX/=pressers.length; avgY/=pressers.length;
    carrierOrientation = angleToward({x:avgX,y:avgY}, carrier);
  }

  return {carrierId:carrier.id, carrierOrientation:carrierOrientation, pressers:pressers.map(function(p){return {x:p.x,y:p.y};}), items:items};
}
function requestSuggestion(){
  var res = computeSupportSuggestion();
  if (res.error){ runtime.suggestion = null; showToast(res.error, "err"); render(); return; }
  runtime.suggestion = res;
  render();
}
function applySuggestion(){
  var s = runtime.suggestion; if (!s) return;
  s.items.forEach(function(it){
    var p = findWorkingObject("player", it.playerId);
    if (p){ p.x = it.x; p.y = it.y; p.orientation = it.orientation; }
  });
  if (s.carrierOrientation!==null){
    var carrier = findWorkingObject("player", s.carrierId);
    if (carrier) carrier.orientation = s.carrierOrientation;
  }
  runtime.suggestion = null;
  markDirty();
  render();
  showToast("Vorschlag übernommen.", "ok");
}
function discardSuggestion(){ runtime.suggestion = null; render(); }

      line.setAttribute("class","path-suggest");

      line.setAttribute("x2", it.x); line.setAttribute("y2", it.y);
      pathsLayer.appendChild(line);
    });
  }
}

   6. IMPORT / EXPORT
   ========================================================= */
function exportJSON(){
  var payload = deepClone(state);
  payload.exportedAt = new Date().toISOString();
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "taktik-export-" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  showToast("Export erstellt.", "ok");
}
function importJSONFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ showToast("Import fehlgeschlagen: ungültiges JSON ("+e.message+").", "err"); return; }
    try{
      migrateState(parsed);
    }catch(e){
      showToast("Import fehlgeschlagen: " + e.message, "err");
      return;
    }
    showConfirm("Import bestätigen", "Der komplette lokale Datenstand wird durch die importierte Datei ersetzt. Fortfahren?", function(){
      state = parsed;
      if (!state.ui) state.ui = emptyRootState().ui;
      if (!state.activeSituationId && state.situations.length) state.activeSituationId = state.situations[0].id;
      var sit = getActiveSituation();
      if (sit && !sit.activeStepId && sit.steps.length) sit.activeStepId = sit.steps[0].id;
      loadWorkingFieldFromStep(getActiveStep());
      persist();
      render();
      showToast("Import erfolgreich.", "ok");
    });
  };
  reader.onerror = function(){ showToast("Datei konnte nicht gelesen werden.", "err"); };
  reader.readAsText(file);
}

/* --- Feld-Marker (Ruhezustand, keine Animation) --- */
function renderFieldIdle(){
  cancelAnimation();
  var mode = state.ui.mode;
  var sit = getActiveSituation();
  var step = getActiveStep();
  var snap;
  if (mode==="editor"){
    snap = runtime.workingField;
  } else {
    snap = step ? {players:step.players, opponents:step.opponents, ball:step.ball} : {players:[],opponents:[],ball:{x:50,y:50,visible:false}};
  }
  document.getElementById("field").classList.toggle("presentation", mode!=="editor");

  var layer = document.getElementById("markers-layer");
  layer.innerHTML = "";

  function shouldShow(o){
    if (mode==="editor") return true;
    return o.visible !== false;
  }

  snap.players.forEach(function(p){ if (shouldShow(p)) layer.appendChild(buildMarkerEl("player", p, mode)); });
  snap.opponents.forEach(function(o){ if (shouldShow(o)) layer.appendChild(buildMarkerEl("opponent", o, mode)); });
  if (mode==="editor" || snap.ball.visible!==false){
    layer.appendChild(buildMarkerEl("ball", snap.ball, mode));
  }

  /* Laufwege sind ein Bewegungshinweis für die Animation, kein Dauerzustand:
     im Ruhezustand (Editor oder angekommener Schritt) bleibt die Fläche leer. */
  clearPaths();

  renderSuggestionOverlay();
}

function buildMarkerEl(kind, o, mode){
  var m = el("div", "marker " + kind);
  m.dataset.kind = kind;
  m.dataset.id = kind==="ball" ? "ball" : o.id;
  m.style.left = xToPercent(o.x) + "%";
  m.style.top = yToPercent(o.y) + "%";
  if (o.visible===false) m.classList.add("ghost");
  if (o.highlighted) m.classList.add("highlighted");
  if (mode==="editor" && runtime.selectedObjectId===o.id) m.classList.add("selected");

  if (mode==="presentation" && state.ui.perspective==="myplayer"){
    if (state.ui.focusPlayerId){
      if (kind==="player" && o.id===state.ui.focusPlayerId) m.classList.add("focused");
      else m.classList.add("dimmed");
    }
  }

  var dot = el("div","dot", kind==="ball" ? "" : (o.number!=null?o.number:""));
  m.appendChild(dot);
  if (kind!=="ball"){
    var facing = el("div","facing");
    facing.style.setProperty("--facing-deg", (o.orientation||0) + "deg");
    m.appendChild(facing);
  }
  if (kind!=="ball" && state.ui.showLabels && (o.name || o.role)){
    m.appendChild(el("div","tag", [o.name,o.role].filter(Boolean).join(" · ")));
  }
  return m;
}

function clearPaths(){ document.getElementById("paths-layer").innerHTML = ""; }

function renderPathsBetween(fromStep, toStep){
  var layer = document.getElementById("paths-layer");
  layer.innerHTML = markerDefsSVG();
  var tracks = buildTracks(fromStep, toStep);
  tracks.forEach(function(tr){
    var dist = Math.hypot(tr.x1-tr.x0, tr.y1-tr.y0);
    if (dist < 2.5) return;
    if (tr.op0<0.05 || tr.op1<0.05) return;
    var cls = tr.kind==="ball" ? "path-ball" : (tr.kind==="opponent" ? "path-opp" : "path-own");
    var marker = tr.kind==="ball" ? "arrow-ball" : (tr.kind==="opponent" ? "arrow-opp" : "arrow-own");
    var ux = (tr.x1-tr.x0)/dist, uy = (tr.y1-tr.y0)/dist;
    var inset = Math.min(2.2, dist*0.25);
    var sx = tr.x0 + ux*inset, sy = tr.y0 + uy*inset;
    var ex = tr.x1 - ux*inset, ey = tr.y1 - uy*inset;
    var path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("class", cls);
    path.setAttribute("marker-end", "url(#"+marker+")");
    path.setAttribute("d", "M "+sx+" "+sy+" L "+ex+" "+ey);
    layer.appendChild(path);
  });
}

function markerDefsSVG(){
  return '<defs>' +
    '<marker id="arrow-own" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+ 'var(--own)' +'"/></marker>' +
    '<marker id="arrow-opp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+ 'var(--opp)' +'"/></marker>' +
    '<marker id="arrow-ball" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+ 'var(--ball)' +'"/></marker>' +
    '</defs>';
}

/* =========================================================
   10. DRAG & DROP
   ========================================================= */
function initDragHandling(){
  var layer = document.getElementById("markers-layer");
  layer.addEventListener("pointerdown", function(e){
    if (state.ui.mode !== "editor") return;
    var markerEl = e.target.closest(".marker");
    if (!markerEl) return;
    var kind = markerEl.dataset.kind;
    var id = markerEl.dataset.id;
    var fieldEl = document.getElementById("field");
    var moved = false;
    var startX = e.clientX, startY = e.clientY;

    markerEl.classList.add("dragging");
    markerEl.setPointerCapture && markerEl.setPointerCapture(e.pointerId);

    function onMove(ev){
      var dx = ev.clientX-startX, dy = ev.clientY-startY;
      if (!moved && (Math.abs(dx)>3 || Math.abs(dy)>3)) moved = true;
      if (!moved) return;
      var rect = fieldEl.getBoundingClientRect();
      var px = clamp((ev.clientX-rect.left)/rect.width*100, 0, 100);
      var py = clamp((ev.clientY-rect.top)/rect.height*100, 0, 100);
      var x = clamp(percentToX(px), 0, 100);
      var y = clamp(percentToY(py), 0, 100);
      var obj = kind==="ball" ? runtime.workingField.ball : findWorkingObject(kind, id);
      if (obj){ obj.x = x; obj.y = y; }
      markerEl.style.left = xToPercent(x)+"%";
      markerEl.style.top = yToPercent(y)+"%";
    }
    function onUp(ev){
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      markerEl.classList.remove("dragging");
      if (moved){
        markDirty();
        render();
      } else {
        if (kind!=="ball"){ runtime.selectedObjectId = id; render(); }
      }
    }
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  });
}

/* =========================================================
   11. ANIMATION & PRÄSENTATION
   ========================================================= */
function buildTracks(fromSnap, toSnap){
  var ids = {};
  (fromSnap.players||[]).forEach(function(o){ ids["p:"+o.id]=1; });
  (toSnap.players||[]).forEach(function(o){ ids["p:"+o.id]=1; });
  (fromSnap.opponents||[]).forEach(function(o){ ids["o:"+o.id]=1; });
  (toSnap.opponents||[]).forEach(function(o){ ids["o:"+o.id]=1; });
  ids["b:ball"]=1;

  var tracks = [];
  Object.keys(ids).forEach(function(key){
    var kindChar = key.charAt(0);
    var id = key.slice(2);
    var kind = kindChar==="p" ? "player" : kindChar==="o" ? "opponent" : "ball";
    var fromList = kind==="player" ? fromSnap.players : kind==="opponent" ? fromSnap.opponents : null;
    var toList = kind==="player" ? toSnap.players : kind==="opponent" ? toSnap.opponents : null;
    var fromObj = kind==="ball" ? fromSnap.ball : (fromList||[]).find(function(o){return o.id===id;});
    var toObj = kind==="ball" ? toSnap.ball : (toList||[]).find(function(o){return o.id===id;});
    if (!fromObj && !toObj) return;
    var ref = toObj || fromObj;
    var x0,y0,op0,x1,y1,op1;
    if (fromObj && toObj){
      x0=fromObj.x; y0=fromObj.y; op0=fromObj.visible===false?0:1;
      x1=toObj.x; y1=toObj.y; op1=toObj.visible===false?0:1;
    } else if (toObj && !fromObj){
      x0=toObj.x; y0=toObj.y; op0=0; x1=toObj.x; y1=toObj.y; op1=toObj.visible===false?0:1;
    } else {
      x0=fromObj.x; y0=fromObj.y; op0=fromObj.visible===false?0:1; x1=fromObj.x; y1=fromObj.y; op1=0;
    }
    tracks.push({
      key: kind==="ball" ? "ball" : (kind==="player"?"p:":"o:")+id,
      kind: kind, id: id,
      number: ref.number, name: ref.name, role: ref.role, highlighted: ref.highlighted,
      x0:x0,y0:y0,op0:op0, x1:x1,y1:y1,op1:op1
    });
  });
  return tracks;
}

function cancelAnimation(){
  if (runtime.presentation.raf){ cancelAnimationFrame(runtime.presentation.raf); runtime.presentation.raf = null; }
}

function animateTransition(fromStep, toStep, duration, onDone){
  cancelAnimation();
  var tracks = buildTracks(fromStep, toStep);
  var layer = document.getElementById("markers-layer");
  layer.innerHTML = "";
  document.getElementById("field").classList.add("presentation");

  var focusMode = state.ui.mode==="presentation" && state.ui.perspective==="myplayer" && state.ui.focusPlayerId;

  var trackEls = tracks.map(function(tr){
    var pseudo = {id:tr.id, number:tr.number, name:tr.name, role:tr.role, highlighted:tr.highlighted, x:tr.x0, y:tr.y0, visible:true};
    var elm = buildMarkerEl(tr.kind==="ball"?"ball":(tr.kind==="player"?"player":"opponent"), pseudo, "presentation");
    if (focusMode){
      elm.classList.remove("dimmed","focused");
      if (tr.kind==="player" && tr.id===state.ui.focusPlayerId) elm.classList.add("focused");
      else elm.classList.add("dimmed");
    }
    layer.appendChild(elm);
    return {tr:tr, elm:elm};
  });

  if (state.ui.showPaths) renderPathsBetween(fromStep, toStep); else clearPaths();

  var start = null;
  function frame(now){
    if (start===null) start = now;
    var t = Math.min(1, (now-start)/duration);
    var e2 = easeInOut(t);
    trackEls.forEach(function(pair){
      var tr = pair.tr;
      var x = lerp(tr.x0, tr.x1, e2), y = lerp(tr.y0, tr.y1, e2), op = lerp(tr.op0, tr.op1, e2);
      pair.elm.style.left = xToPercent(x)+"%";
      pair.elm.style.top = yToPercent(y)+"%";
      pair.elm.style.opacity = op;
    });
    if (t<1){ runtime.presentation.raf = requestAnimationFrame(frame); }
    else { runtime.presentation.raf = null; onDone && onDone(); }
  }
  runtime.presentation.raf = requestAnimationFrame(frame);
}

function presGoToStep(stepId, animate){
  var sit = getActiveSituation(); if (!sit) return;
  var fromStep = getActiveStep();
  sit.activeStepId = stepId;
  persist();
  var toStep = getActiveStep();
  if (!animate || !fromStep || fromStep.id===toStep.id){
    render();
    return;
  }
  var duration = SPEEDS[state.ui.speed] || SPEEDS.normal;
  animateTransition(fromStep, toStep, duration, function(){ render(); });
}

function presNext(cb){
  var sit = getActiveSituation(); if (!sit) return;
  var idx = getStepIndex(sit, sit.activeStepId);
  if (idx<0 || idx>=sit.steps.length-1){ cb && cb(false); return; }
  var target = sit.steps[idx+1];
  var fromStep = getActiveStep();
  sit.activeStepId = target.id;
  persist();
  var duration = SPEEDS[state.ui.speed] || SPEEDS.normal;
  renderPresentationBar(sit);
  animateTransition(fromStep, target, duration, function(){ render(); cb && cb(true); });
}
function presPrev(){
  var sit = getActiveSituation(); if (!sit) return;
  var idx = getStepIndex(sit, sit.activeStepId);
  if (idx<=0) return;
  presGoToStep(sit.steps[idx-1].id, true);
}
function presResetToStart(){
  var sit = getActiveSituation(); if (!sit || !sit.steps.length) return;
  stopPlayback();
  presGoToStep(sit.steps[0].id, false);
}
function stopPlayback(){
  runtime.presentation.playing = false;
  runtime.presentation.stopRequested = true;
  if (runtime.presentation.playTimeout){ clearTimeout(runtime.presentation.playTimeout); runtime.presentation.playTimeout=null; }
}
function togglePlay(){
  if (runtime.presentation.playing){ stopPlayback(); render(); return; }
  var sit = getActiveSituation(); if (!sit || sit.steps.length<2) return;
  runtime.presentation.playing = true;
  runtime.presentation.stopRequested = false;
  renderPresentationBar(sit);
  stepLoop();
}
function stepLoop(){
  if (runtime.presentation.stopRequested){ runtime.presentation.playing=false; render(); return; }
  presNext(function(advanced){
    if (!advanced){ runtime.presentation.playing=false; render(); return; }
    if (runtime.presentation.stopRequested){ runtime.presentation.playing=false; render(); return; }
    var hold = HOLD_MS[state.ui.speed] || HOLD_MS.normal;
    runtime.presentation.playTimeout = setTimeout(function(){
      if (runtime.presentation.stopRequested){ runtime.presentation.playing=false; render(); return; }
      stepLoop();
    }, hold);
  });
}

  document.getElementById("btn-export").addEventListener("click", exportJSON);
  document.getElementById("btn-import").addEventListener("click", function(){ document.getElementById("file-input").click(); });

    if (f) importJSONFile(f);
    e.target.value = "";
  });

  document.getElementById("sit-category").addEventListener("change", function(e){ setCategory(e.target.value); });
  document.getElementById("sit-fieldview").addEventListener("change", function(e){ setFieldView(e.target.value); });

  document.getElementById("btn-add-player").addEventListener("click", addOwnPlayer);
  document.getElementById("btn-add-opponent").addEventListener("click", addOpponent);
  document.getElementById("btn-apply-own-formation").addEventListener("click", function(){
    applyFormationTo("player", document.getElementById("own-formation-select").value);
  });
  document.getElementById("btn-apply-opp-formation").addEventListener("click", function(){

  });

  document.getElementById("ball-visible").addEventListener("change", toggleBallVisible);
  document.getElementById("ball-owner").addEventListener("change", function(e){ setBallOwner(e.target.value); });

  document.getElementById("chk-show-labels").addEventListener("change", function(e){ toggleShowLabels(e.target.checked); });
  document.getElementById("chk-show-paths").addEventListener("change", function(e){ toggleShowPaths(e.target.checked); });

  document.getElementById("step-name-input").addEventListener("change", function(e){
    var step = getActiveStep(); if (!step) return;
    renameStep(step.id, e.target.value);
  });
  document.getElementById("step-note-input").addEventListener("change", function(e){
    var step = getActiveStep(); if (!step) return;
    step.note = e.target.value; persist(); render();
  });

  document.getElementById("btn-prev").addEventListener("click", function(){ stopPlayback(); presPrev(); });

  document.getElementById("speed-select").addEventListener("change", function(e){ setSpeed(e.target.value); });
  document.querySelectorAll(".persp-toggle button").forEach(function(b){
    b.addEventListener("click", function(){ setPerspective(b.dataset.persp); });
  });
  document.getElementById("focus-player-select").addEventListener("change", function(e){ setFocusPlayer(e.target.value); });

  document.getElementById("btn-suggest").addEventListener("click", requestSuggestion);

  initDragHandling();
  initCollapsiblePanels();
}

function initCollapsiblePanels(){
  document.querySelectorAll("#sidebar-left .panel-box, #sidebar-right .panel-box").forEach(function(box){
    var h3 = box.querySelector("h3"); if (!h3) return;
    var btn = el("button","small ghost collapse-toggle", box.classList.contains("collapsed") ? "▸" : "▾");
    btn.title = "Ein-/Ausklappen";
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      box.classList.toggle("collapsed");
      btn.textContent = box.classList.contains("collapsed") ? "▸" : "▾";
    });
    h3.appendChild(btn);
  });
}

   13. START
   ========================================================= */
function init(){
  loadPersisted();
  var sit = getActiveSituation();
  if (sit && !sit.activeStepId && sit.steps.length) sit.activeStepId = sit.steps[0].id;
  loadWorkingFieldFromStep(getActiveStep());
  initEvents();
  render();
}

document.addEventListener("DOMContentLoaded", init);
})();
